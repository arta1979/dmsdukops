    <script>
        // ================= KONFIGURASI UTAMA =================
        const LOCAL_DATA_URL = "data/desa/daftar.txt";
        const LOCAL_DESA_FILES = [
            "Ambengan.txt", "Pegadungan.txt", "Wanagiri.txt", "Panji_Anom.txt",
            "Sambangan.txt", "Tegallinggah.txt", "Selat.txt", "Pegayaman.txt",
            "Padang_Bulia.txt", "Gitgit.txt", "Kayuputih.txt", "Panji.txt",
            "Silangjana.txt", "Kelurahan_Sukasada.txt"
        ];
        const TELEGRAM_BOT_TOKEN = "7580586404:AAFi3ySF36vBtLUiZUUsUrWuszBF2lBz7W0";
        const TELEGRAM_CHAT_ID = "2095166318"; // ID MangSatria79
        const TELEGRAM_MANG_USERNAME = "@MangSatria79";
        const TELEGRAM_CHANNEL_ID = "-1003473372527";
        
        // ================= KONFIGURASI VALIDASI FOTO =================
        const MAX_FILE_SIZE = 10 * 1024 * 1024; // 10 MB
        const ALLOWED_TYPES = ['image/jpeg', 'image/png', 'image/jpg', 'image/gif', 'image/webp'];
        const MIN_WIDTH = 640;
        const MIN_HEIGHT = 480;
        
        // ================= VARIABEL GLOBAL =================
        let img = new Image();
        let selectedDesa = "";
        let kordinatList = [];
        let currentKoordinat = "";
        let tanggalWaktu = "";
        let lastSubmittedDate = null;
        let submissionCount = 0;
        let submittedDates = [];
        let channelConnected = false;
        let currentFile = null;
        let fileIsValid = false;
        const DEVICE_TIME_ZONE = Intl.DateTimeFormat().resolvedOptions().timeZone;

        function getDeviceZoneLabel(date = new Date()) {
            const offsetMinutes = -date.getTimezoneOffset();
            if (offsetMinutes === 420) return "WIB";
            if (offsetMinutes === 480) return "WITA";
            if (offsetMinutes === 540) return "WIT";
            return DEVICE_TIME_ZONE || "Waktu perangkat";
        }

        function getIndonesiaDateParts(date = new Date()) {
            const parts = new Intl.DateTimeFormat('en-CA', {
                timeZone: DEVICE_TIME_ZONE,
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit',
                hourCycle: 'h23'
            }).formatToParts(date);
            return Object.fromEntries(parts
                .filter(part => part.type !== 'literal')
                .map(part => [part.type, part.value]));
        }

        function formatIndonesiaDate(date, options) {
            return date.toLocaleString('id-ID', {
                timeZone: DEVICE_TIME_ZONE,
                ...options
            });
        }

        function parseIndonesiaInput(value) {
            return new Date(value);
        }

        function updateStoredFileTicker(fileName) {
            const ticker = document.getElementById("storedFileTicker");
            if (!ticker) return;
            ticker.innerHTML = `<span>ZIP tersimpan di Google Drive: ${fileName}</span>`;
        }

        function getBabinsaIdentity(desaName) {
            const namaWilayah = desaName.replace(/^Kelurahan\s+/i, '').trim();
            return `Babinsa  ${namaWilayah}`;
        }
        
        // ================= VARIABEL CHAT HYBRID =================
        let lastUpdateId = 0;
        let chatConnectionActive = false;
        let unreadMessages = 0;
        let chatHistory = [];
        let ignoredMessageIds = new Set();
        let chatMode = 'mang'; // 'mang', 'bot', 'both'
        const POLL_INTERVAL = 3000;
        const CHAT_HISTORY_KEY = 'dukops_chat_history';
        const MAX_CHAT_HISTORY = 100;
        
        // ================= FUNGSI UTAMA CHAT =================
        
        function updateChatDesaBadge() {
            const badge = document.getElementById('currentDesaBadge');
            const userBadge = document.getElementById('userDesaBadge');
            if (!badge || !userBadge) return;
            
            if (selectedDesa) {
                badge.textContent = selectedDesa;
                badge.style.background = 'rgba(76, 175, 80, 0.3)';
                userBadge.textContent = selectedDesa;
                userBadge.style.background = '#2563EB';
            } else {
                badge.textContent = 'Belum Pilih Desa';
                badge.style.background = 'rgba(255, 152, 0, 0.2)';
                userBadge.textContent = 'Belum Pilih Desa';
                userBadge.style.background = '#315A8A';
            }
        }
        
        function setChatMode(mode) {
            chatMode = mode;
            
            // Update UI button states
            document.querySelectorAll('.chat-option-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            
            const activeBtn = document.getElementById(mode + 'ModeBtn');
            if (activeBtn) activeBtn.classList.add('active');
            
            // Show notification
            let modeText = '';
            switch(mode) {
                case 'mang':
                    modeText = 'Mengirim ke @MangSatria79 saja';
                    break;
                case 'bot':
                    modeText = 'Mengirim ke Bot Asisten saja';
                    break;
                case 'both':
                    modeText = 'Mengirim ke @MangSatria79 dan Bot';
                    break;
            }
            
            addChatMessage({
                type: 'system',
                text: `ðŸ“¡ Mode chat: ${modeText}`,
                timestamp: new Date().toISOString()
            });
            
            // Save preference
            localStorage.setItem('dukops_chat_mode', mode);
        }
        
        function initChatSystem() {
            console.log('ðŸ’¬ Initializing hybrid chat system...');
            
            // Load chat mode preference
            const savedMode = localStorage.getItem('dukops_chat_mode');
            if (savedMode) {
                setChatMode(savedMode);
            } else {
                setChatMode('mang');
            }
            
            // Update desa badge
            updateChatDesaBadge();
            
            // Load chat history
            loadChatHistory();
            
            // Setup event listeners
            setupChatEvents();
            
            // Setup chat input auto-focus
            setupChatInputAutoFocus();
            
            // Clean auto-reply
            setTimeout(cleanAutoReplyFromHistory, 1000);
            
            // Start polling
            startTelegramPolling();
            
            // Update UI status
            updateChatStatus('connecting');
            
            // Welcome message
            setTimeout(() => {
                updateChatStatus('connected');
                addChatMessage({
                    type: 'info',
                    text: `ðŸ’¬ Chat Hybrid aktif!<br>
                    â€¢ Pilih mode chat di atas<br>
                    â€¢ Default: Kirim ke ${TELEGRAM_MANG_USERNAME}<br>
                    â€¢ Identitas: Nama desa akan ditampilkan`,
                    timestamp: new Date().toISOString()
                });
            }, 1500);
        }
        
        function setupChatEvents() {
            // Chat toggle button
            document.getElementById('chatToggleBtn').onclick = toggleChatWidget;
            
            // Close chat button
            document.getElementById('closeChat').onclick = toggleChatWidget;
            
            // Chat input enter key
            const chatInput = document.getElementById('chatInput');
            chatInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendChatMessage();
                }
            });
        }
        
        function setupChatInputAutoFocus() {
            const chatToggleBtn = document.getElementById('chatToggleBtn');
            const chatWidget = document.getElementById('telegramChatWidget');
            const chatInput = document.getElementById('chatInput');
            
            chatToggleBtn.addEventListener('click', function() {
                setTimeout(() => {
                    if (chatWidget.style.display === 'flex') {
                        chatInput.focus();
                        unreadMessages = 0;
                        updateUnreadCounter();
                    }
                }, 200);
            });
        }
        
        function toggleChatWidget() {
            const widget = document.getElementById('telegramChatWidget');
            const toggleBtn = document.getElementById('chatToggleBtn');
            
            if (widget.style.display === 'flex') {
                widget.style.display = 'none';
                toggleBtn.innerHTML = '<i class="fas fa-comment-alt"></i>';
                if (unreadMessages > 0) {
                    toggleBtn.querySelector('.badge').style.display = 'flex';
                }
            } else {
                widget.style.display = 'flex';
                toggleBtn.innerHTML = '<i class="fas fa-times"></i>';
                
                unreadMessages = 0;
                updateUnreadCounter();
                
                setTimeout(() => {
                    const messagesContainer = document.getElementById('chatMessages');
                    if (messagesContainer.children.length > 0) {
                        messagesContainer.scrollTop = messagesContainer.scrollHeight;
                    }
                }, 100);
                
                setTimeout(() => {
                    document.getElementById('chatInput').focus();
                }, 150);
            }
        }
        
        function startTelegramPolling() {
            chatConnectionActive = true;
            
            pollTelegramMessages();
            
            const pollInterval = setInterval(() => {
                if (chatConnectionActive) {
                    pollTelegramMessages();
                } else {
                    clearInterval(pollInterval);
                }
            }, POLL_INTERVAL);
        }
        
        async function pollTelegramMessages() {
            try {
                const response = await fetch(
                    `https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getUpdates?offset=${lastUpdateId + 1}&timeout=2`
                );
                
                if (response.ok) {
                    const data = await response.json();
                    
                    if (data.ok && data.result.length > 0) {
                        lastUpdateId = data.result[data.result.length - 1].update_id;
                        
                        data.result.forEach(update => {
                            if (update.message && update.message.text) {
                                const msg = update.message;
                                const msgId = msg.message_id;
                                const msgText = msg.text;
                                const senderName = msg.from?.first_name || '';
                                const senderId = msg.from?.id;
                                
                                if (ignoredMessageIds.has(msgId)) return;
                                
                                // FILTER AUTO-REPLY
                                const isAutoReply = 
                                    msgText.includes('BOT INPUT BABINSA') ||
                                    msgText.includes('Terima kasih. Silakan isi form') ||
                                    msgText.includes('Noted. Untuk bantuan ketik') ||
                                    msgText.includes('Pesan tercatat. Lanjutkan') ||
                                    msgText.includes('Dapat pesan dari') ||
                                    msgText.includes('Pesan diterima. Form DUKOPS aktif') ||
                                    msgText.includes('Terima kasih pesannya') ||
                                    /^BOT INPUT/.test(msgText) ||
                                    /^Terima kasih\./.test(msgText) ||
                                    /^Noted\./.test(msgText);
                                
                                const isFromBot = msg.from?.is_bot || senderName.includes('BOT');
                                
                                if (isAutoReply || isFromBot) {
                                    ignoredMessageIds.add(msgId);
                                    console.log('ðŸ”‡ Ignored auto-reply');
                                    return;
                                }
                                
                                // Tampilkan semua pesan dari MangSatria79
                                processIncomingMessage(msg);
                            }
                        });
                        
                        updateChatStatus('connected');
                        updateChannelStatus(true);
                    }
                }
            } catch (error) {
                updateChatStatus('disconnected');
                updateChannelStatus(false);
            }
        }
        
        function cleanAutoReplyFromHistory() {
            const messages = document.querySelectorAll('#chatMessages .chat-message');
            messages.forEach(msg => {
                const textEl = msg.querySelector('.message-text');
                if (textEl) {
                    const text = textEl.textContent;
                    if (text.includes('BOT INPUT') || 
                        text.includes('Terima kasih. Silakan') ||
                        text.includes('Noted. Untuk bantuan')) {
                        msg.remove();
                    }
                }
            });
        }
        
        function processIncomingMessage(message) {
            if (message.from.is_bot) return;
            
            const messageText = message.text;
            const senderName = message.from.first_name || 'User';
            const senderId = message.from.id;
            const chatId = message.chat.id;
            
            // Tentukan apakah ini dari MangSatria79 atau user lain
            let senderDisplay = senderName;
            if (senderId == TELEGRAM_CHAT_ID) {
                senderDisplay = 'ðŸ‘‘ ' + senderName + ' (MangSatria79)';
            }
            
            // Tampilkan di chat
            addChatMessage({
                type: 'incoming',
                text: messageText,
                sender: senderDisplay,
                timestamp: new Date(message.date * 1000).toISOString()
            });
            
            // Unread counter
            if (document.getElementById('telegramChatWidget').style.display !== 'flex') {
                unreadMessages++;
                updateUnreadCounter();
            }
            
            // Handle command jika dari MangSatria79
            if (senderId == TELEGRAM_CHAT_ID) {
                handleIncomingCommand(messageText, senderName, chatId);
            }
            
            saveChatHistory();
        }
        
        function handleIncomingCommand(message, sender, chatId) {
            const lowerMsg = message.toLowerCase().trim();
            
            // Hanya MangSatria79 yang bisa reset
            if (lowerMsg === 'reset' && chatId == TELEGRAM_CHAT_ID) {
                resetForm();
                sendTelegramReply(chatId, 'âœ… Form telah direset oleh MangSatria79.');
            }
            
            // Auto-reply untuk pesan tertentu
            if (lowerMsg === 'status') {
                sendTelegramReply(chatId, `ðŸ“Š Status Form: ${getFormStatus()}\nðŸ“ˆ Total: ${submissionCount} laporan`);
            }
        }
        
        async function sendChatMessage() {
            const input = document.getElementById('chatInput');
            if (!input || !input.value.trim()) return;
            
            const message = input.value.trim();
            const timestamp = new Date().toISOString();
            
            // Jika belum pilih desa, warning
            if (!selectedDesa) {
                addChatMessage({
                    type: 'error',
                    text: 'âŒ Silakan pilih desa/kelurahan terlebih dahulu!',
                    timestamp: timestamp
                });
                return;
            }
            
            // Tampilkan di chat UI sebagai outgoing DENGAN NAMA DESA
            addChatMessage({
                type: 'outgoing',
                text: message,
                sender: `Anda (Babinsa ${selectedDesa})`,
                timestamp: timestamp
            });
            
            // Reset input
            input.value = '';
            input.style.height = '45px';
            
            // Kirim berdasarkan mode dengan IDENTITAS DESA
            try {
                let promises = [];
                let modeText = '';
                
                // Format pesan dengan identitas desa
                const messageWithIdentity = `ðŸ’¬ Pesan dari Babinsa ${selectedDesa} (Form DUKOPS):\n${message}`;
                const simpleMessage = `Babinsa ${selectedDesa}: ${message}`;
                
                if (chatMode === 'mang' || chatMode === 'both') {
                    // Kirim ke @MangSatria79 dengan identitas
                    promises.push(
                        fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                chat_id: TELEGRAM_CHAT_ID,
                                text: messageWithIdentity,
                                parse_mode: 'Markdown'
                            })
                        })
                    );
                    modeText += '@MangSatria79 ';
                }
                
                if (chatMode === 'bot' || chatMode === 'both') {
                    // Kirim ke bot dengan identitas
                    promises.push(
                        fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                chat_id: TELEGRAM_CHAT_ID,
                                text: simpleMessage,
                                parse_mode: 'Markdown'
                            })
                        })
                    );
                    modeText += 'Bot ';
                }
                
                // Tunggu semua kiriman selesai
                const results = await Promise.allSettled(promises);
                
                // Cek hasil
                const successCount = results.filter(r => r.status === 'fulfilled' && r.value.ok).length;
                
                if (successCount === 0) {
                    addChatMessage({
                        type: 'error',
                        text: 'âŒ Gagal mengirim pesan',
                        timestamp: new Date().toISOString()
                    });
                } else {
                    // Tampilkan info pengiriman berhasil
                    addChatMessage({
                        type: 'system',
                        text: `âœ… Pesan terkirim ke: ${modeText.trim()}\nðŸ“‹ Identitas: Babinsa ${selectedDesa}`,
                        timestamp: new Date().toISOString()
                    });
                }
                
            } catch (error) {
                addChatMessage({
                    type: 'error',
                    text: 'âš ï¸ Koneksi error. Periksa internet Anda.',
                    timestamp: new Date().toISOString()
                });
            }
            
            saveChatHistory();
        }
        
        async function sendTelegramReply(chatId, message) {
            try {
                await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: chatId,
                        text: message
                    })
                });
            } catch (error) {
                console.log('Failed to send reply');
            }
        }
        
        function addChatMessage(messageData) {
            const messagesContainer = document.getElementById('chatMessages');
            if (!messagesContainer) return;
            
            const messageElement = document.createElement('div');
            
            let messageClass = '';
            switch(messageData.type) {
                case 'outgoing': messageClass = 'message-outgoing'; break;
                case 'incoming': messageClass = 'message-incoming'; break;
                case 'system': messageClass = 'message-system'; break;
                case 'error': messageClass = 'message-error'; break;
                case 'info': messageClass = 'message-info'; break;
            }
            
            const time = new Date(messageData.timestamp).toLocaleTimeString('id-ID', {
                hour: '2-digit',
                minute: '2-digit'
            });
            
            // Tambahkan badge desa untuk pesan outgoing
            let senderHtml = '';
            if (messageData.sender) {
                if (messageData.type === 'outgoing' && selectedDesa) {
                    senderHtml = `<div class="message-sender">
                        ${messageData.sender}
                        <span class="sender-badge">${selectedDesa}</span>
                    </div>`;
                } else {
                    senderHtml = `<div class="message-sender">${messageData.sender}</div>`;
                }
            }
            
            messageElement.className = `chat-message ${messageClass}`;
            messageElement.innerHTML = `
                ${senderHtml}
                <div class="message-text">${messageData.text}</div>
                <div class="message-time">${time}</div>
            `;
            
            messagesContainer.appendChild(messageElement);
            
            setTimeout(() => {
                messagesContainer.scrollTop = messagesContainer.scrollHeight;
            }, 50);
            
            chatHistory.push({
                ...messageData,
                id: Date.now()
            });
            
            if (chatHistory.length > MAX_CHAT_HISTORY) {
                chatHistory = chatHistory.slice(-MAX_CHAT_HISTORY);
            }
        }
        
        function loadChatHistory() {
            try {
                const saved = localStorage.getItem(CHAT_HISTORY_KEY);
                if (saved) {
                    chatHistory = JSON.parse(saved);
                    const recentMessages = chatHistory.slice(-10);
                    recentMessages.forEach(msg => {
                        addChatMessage(msg);
                    });
                }
            } catch (error) {
                console.log('Error loading chat history');
            }
        }
        
        function saveChatHistory() {
            try {
                localStorage.setItem(CHAT_HISTORY_KEY, JSON.stringify(chatHistory));
            } catch (error) {
                console.log('Error saving chat history');
            }
        }
        
        function updateUnreadCounter() {
            const badge = document.getElementById('unreadCount');
            if (badge) {
                if (unreadMessages > 0) {
                    badge.textContent = unreadMessages > 9 ? '9+' : unreadMessages;
                    badge.style.display = 'flex';
                } else {
                    badge.style.display = 'none';
                }
            }
        }
        
        function updateChatStatus(status) {
            const statusElement = document.getElementById('chatStatus');
            if (!statusElement) return;
            
            switch(status) {
                case 'connected':
                    statusElement.innerHTML = `<i class="fas fa-circle status-icon connected"></i> Terhubung ke ${TELEGRAM_MANG_USERNAME} & Bot`;
                    break;
                case 'disconnected':
                    statusElement.innerHTML = `<i class="fas fa-circle status-icon disconnected"></i> Offline`;
                    break;
                case 'connecting':
                    statusElement.innerHTML = `<i class="fas fa-circle status-icon connecting"></i> Menghubungkan...`;
                    break;
            }
        }
        
        // ================= FUNGSI VALIDASI FOTO =================
        
        function validateAndPreviewImage() {
            const fileInput = document.getElementById("gambar");
            const validationMsg = document.getElementById("fileValidation");
            
            // Reset state
            validationMsg.className = "validation-message";
            validationMsg.textContent = "";
            fileIsValid = false;
            document.getElementById("canvas").style.display = "none";
            img = new Image();
            
            if (!fileInput.files || fileInput.files.length === 0) {
                validationMsg.className = "validation-message validation-warning";
                validationMsg.textContent = "âš ï¸ Silakan pilih file gambar";
                return;
            }
            
            currentFile = fileInput.files[0];
            
            // Validasi 1: Tipe file
            if (!ALLOWED_TYPES.includes(currentFile.type)) {
                validationMsg.className = "validation-message validation-error";
                validationMsg.textContent = `âŒ Format file tidak didukung. Gunakan: JPEG, PNG, GIF, WebP`;
                fileInput.value = "";
                return;
            }
            
            // Validasi 2: Ukuran file
            if (currentFile.size > MAX_FILE_SIZE) {
                validationMsg.className = "validation-message validation-error";
                validationMsg.textContent = `âŒ File terlalu besar (${formatFileSize(currentFile.size)}). Maksimal: ${formatFileSize(MAX_FILE_SIZE)}`;
                fileInput.value = "";
                return;
            }
            
            // Preview gambar
            const reader = new FileReader();
            reader.onload = function(e) {
                img = new Image();
                img.src = e.target.result;
                
                img.onload = function() {
                    // Validasi 3: Dimensi gambar
                    const width = img.width;
                    const height = img.height;
                    
                    let validationStatus = "";
                    let statusClass = "";
                    
                    if (width < MIN_WIDTH || height < MIN_HEIGHT) {
                        validationStatus = `âš ï¸ Resolusi rendah (min: ${MIN_WIDTH}Ã—${MIN_HEIGHT})`;
                        statusClass = "validation-warning";
                        fileIsValid = false;
                        document.getElementById("canvas").style.display = "none";
                    } else {
                        validationStatus = "âœ… Resolusi memadai";
                        statusClass = "validation-success";
                        fileIsValid = true;
                        document.getElementById("canvas").style.display = "block";
                    }
                    
                    validationMsg.className = `validation-message ${statusClass}`;
                    validationMsg.innerHTML = `
                        ${validationStatus}<br>
                        <small>Rasio: ${(width/height).toFixed(2)}:1 | Format: ${currentFile.type.split('/')[1].toUpperCase()}</small>
                    `;
                    
                    // Load koordinat jika ada
                    if (kordinatList.length > 0) {
                        pickRandomKoordinat();
                    }
                    
                    updatePreview();
                    checkInputCompletion();
                };
                
                img.onerror = function() {
                    document.getElementById("canvas").style.display = "none";
                    validationMsg.className = "validation-message validation-error";
                    validationMsg.textContent = "âŒ Gagal memuat gambar. File mungkin rusak.";
                    fileInput.value = "";
                    fileIsValid = false;
                };
            };
            
            reader.readAsDataURL(currentFile);
        }
        
        function formatFileSize(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        function updateDatePreview() {
            const tglInput = document.getElementById("tanggalWaktu").value;
            const preview = document.getElementById("previewTanggal");
            const display = document.getElementById("tanggalWaktuDisplay");
            
            if (tglInput) {
                let date;
                
                if (tglInput.includes('T')) {
                    date = parseIndonesiaInput(tglInput);
                } else {
                    const [datePart, timePart] = tglInput.split(' ');
                    const [year, month, day] = datePart.split('-');
                    const [hours, minutes] = timePart.split(':');
                    date = new Date(year, month - 1, day, hours, minutes);
                }
                
                const inputTime = tglInput.split('T')[1] || '';
                const inputSeconds = inputTime.split(':')[2];
                date.setSeconds(inputSeconds ? Number(inputSeconds) : new Date().getSeconds());
                tanggalWaktu = date.toISOString();
                
                const options = {
                    weekday: 'long', 
                    day: '2-digit', 
                    month: 'long', 
                    year: 'numeric',
                    hour: '2-digit', 
                    minute: '2-digit', 
                    second: '2-digit',
                    hour12: false
                };
                
                if (date.toLocaleDateString) {
                    const formattedDate = `${formatIndonesiaDate(date, options)} ${getDeviceZoneLabel(date)}`;
                    preview.textContent = "";
                    if (display) display.value = formattedDate;

                tanggalWaktu = "";

        function updatePreview() {
            const canvas = document.getElementById("canvas");
            const ctx = canvas.getContext("2d");
            const canvasWidth = 800;
            const canvasHeight = 600;

            canvas.width = canvasWidth;
            canvas.height = canvasHeight;
            
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            if (img.src && img.complete) {
                const imageRatio = img.width / img.height;
                const canvasRatio = canvasWidth / canvasHeight;
                let sourceWidth = img.width;
                let sourceHeight = img.height;
                let sourceX = 0;
                let sourceY = 0;

                if (imageRatio > canvasRatio) {
                    sourceWidth = img.height * canvasRatio;
                    sourceX = (img.width - sourceWidth) / 2;
                } else {
                    sourceHeight = img.width / canvasRatio;
                    sourceY = (img.height - sourceHeight) / 2;
                }

                ctx.drawImage(
                    img,
                    sourceX,
                    sourceY,
                    sourceWidth,
                    sourceHeight,
                    0,
                    0,
                    canvasWidth,
                    canvasHeight
                );
            } else {
                ctx.fillStyle = "#000";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }
            
            if (selectedDesa || currentKoordinat || tanggalWaktu) {
                ctx.textAlign = "right";
                ctx.font = "36px Arial";
                ctx.fillStyle = "white";
                ctx.strokeStyle = "rgba(0, 0, 0, 0.85)";
                ctx.lineWidth = 4;
                ctx.lineJoin = "round";
                
                const bottomMargin = 20;
                const lineHeight = 40;
                const rightMargin = 10;
                
                if (selectedDesa) {
                    ctx.strokeText("Babinsa " + selectedDesa, 
                                  canvas.width - rightMargin, 
                                  canvas.height - bottomMargin - (lineHeight * 2));
                    
                    ctx.fillStyle = "white";
                    ctx.fillText("Babinsa " + selectedDesa, 
                                canvas.width - rightMargin, 
                                canvas.height - bottomMargin - (lineHeight * 2));
                }
                
                if (currentKoordinat) {
                    ctx.strokeText(currentKoordinat, 
                                  canvas.width - rightMargin, 
                                  canvas.height - bottomMargin - lineHeight);
                    
                    ctx.fillStyle = "white";
                    ctx.fillText(currentKoordinat, 
                                canvas.width - rightMargin, 
                                canvas.height - bottomMargin - lineHeight);
                }
                
                if (tanggalWaktu) {
                    const date = new Date(tanggalWaktu);
                    let dateText;
                    
                    if (date.toLocaleDateString) {
                        const watermarkSeconds = String(date.getSeconds()).padStart(2, "0");
                        dateText = formatIndonesiaDate(date, { 
                            day: "2-digit", 
                            month: "long", 
                            year: "numeric" 
                        }) + ", " + 
                        formatIndonesiaDate(date, { 
                            hour: "2-digit", 
                            minute: "2-digit", 
                            hour12: false
                        }).replace(":", ".") + `.${watermarkSeconds}`;
                    }
                    
                    ctx.strokeText(dateText, 
                                  canvas.width - rightMargin, 
                                  canvas.height - bottomMargin);
                    
                    ctx.fillStyle = "white";
                    ctx.fillText(dateText, 
                                canvas.width - rightMargin, 
                                canvas.height - bottomMargin);
                }
            }
        }

        function createSafeFileName(value) {
            return (value || "laporan")
                .normalize("NFKD")
                .replace(/[^\w\s-]/g, "")
                .trim()
                .replace(/\s+/g, "_")
                .replace(/-+/g, "-") || "laporan";
        }

        function getSubmissionBaseName() {
            const desa = createSafeFileName(selectedDesa || "Tanpa_Desa");
            const inputValue = document.getElementById("tanggalWaktu").value;
            const datePart = inputValue ? inputValue.split("T")[0] : "";
            const dateParts = datePart.split("-");

                ? `${dateParts[2]}-${dateParts[1]}-${dateParts[0]}`
                : "Tanpa_Tanggal";

        function canvasToBlob(canvas) {
            return new Promise((resolve, reject) => {
                canvas.toBlob(blob => {
                    if (blob) {
                        resolve(blob);
                    } else {
                        reject(new Error("Gagal membuat gambar laporan"));
                    }
                }, "image/png");
            });
        }

        async function downloadSubmissionZip() {
            if (typeof JSZip === "undefined") {
                throw new Error("Modul ZIP belum tersedia. Periksa koneksi lalu muat ulang halaman.");
            }

            const canvas = document.getElementById("canvas");
            const baseName = getSubmissionBaseName();
            const imageBlob = await canvasToBlob(canvas);
            const reportText = buildSubmissionNarrative();

            const zip = new JSZip();
            zip.file(`${baseName}.png`, imageBlob);
            zip.file(`${baseName}.txt`, reportText);
            const zipBlob = await zip.generateAsync({ type: "blob", compression: "DEFLATE" });
            return { zipBlob, baseName };
        }

        async function processSubmission() {
            const submitButton = document.getElementById("submitBtn");
            if (submitButton.dataset.processing === "true") return;
            if (!selectedDesa || !currentKoordinat || !fileIsValid || !tanggalWaktu) {
                checkInputCompletion();
                return;
            }

            if (isDuplicateSubmission()) {
                alert("Laporan dengan desa dan tanggal yang sama pada bulan dan tahun tersebut sudah pernah dikirim.");
                return;
            }

            submitButton.dataset.processing = "true";
            submitButton.disabled = true;
            submitButton.classList.add("is-processing");
            const originalButtonText = submitButton.innerHTML;
            submitButton.innerHTML = `<i class="fas fa-spinner fa-spin"></i> ${selectedDesa}`;
            try {
                const submission = await downloadSubmissionZip();
                const driveUploaded = await window.uploadToGoogleDrive(
                    submission.zipBlob,
                    `${submission.baseName}.zip`,
                    selectedDesa,
                    new Date(tanggalWaktu)
                );
                updateCounter();
                saveSubmittedDate(tanggalWaktu);
                addSendLog(`${submission.baseName}.zip`, "success");
                if (driveUploaded) {
                    updateStoredFileTicker(`${submission.baseName}.zip`);
                }
                if (!driveUploaded) {
                    showNotification("Laporan berhasil diunduh, tetapi Google Drive menolak upload.", "warning");
                }
            } catch (error) {
                console.error("Gagal membuat ZIP laporan:", error);
                addSendLog(`${getSubmissionBaseName()}.zip`, "failed", error.message);
            } finally {
                submitButton.disabled = false;
                submitButton.dataset.processing = "false";
                submitButton.classList.remove("is-processing");
                submitButton.innerHTML = originalButtonText;
                checkInputCompletion();
            }
        }

        function addSendLog(filename, status, message = "") {
            const logsContainer = document.getElementById("logTerkirim");
            if (!logsContainer) {
                saveSendLog(filename, status, new Date().toLocaleTimeString('id-ID'));
                return;
            }
            const logEntry = document.createElement("div");
            logEntry.className = "log-entry";
            
            const time = new Date().toLocaleTimeString('id-ID');
            const statusClass = status === "success" ? "success" : "failed";
            
            logEntry.innerHTML = `
                <div class="log-time">${time}</div>
                <div class="log-filename">${filename}</div>
                <div class="log-status ${statusClass}">${status.toUpperCase()}</div>
            `;
            
            logsContainer.insertBefore(logEntry, logsContainer.firstChild);
            saveSendLog(filename, status, time);
        }

        function saveSendLog(filename, status, time) {
            let logs = JSON.parse(localStorage.getItem('dukopsSendLogs') || '[]');
            logs.unshift({ filename, status, time });
            if (logs.length > 50) logs = logs.slice(0, 50);
            localStorage.setItem('dukopsSendLogs', JSON.stringify(logs));
        }

        function loadSendLogs() {
            const logs = JSON.parse(localStorage.getItem('dukopsSendLogs') || '[]');
            const container = document.getElementById("logTerkirim");
            if (!container) return;
            
            logs.forEach(log => {
                const logEntry = document.createElement("div");
                logEntry.className = "log-entry";
                const statusClass = log.status === "success" ? "success" : "failed";
                
                logEntry.innerHTML = `
                    <div class="log-time">${log.time}</div>
                    <div class="log-filename">${log.filename}</div>
                    <div class="log-status ${statusClass}">${log.status.toUpperCase()}</div>
                `;
                
                container.appendChild(logEntry);
            });
        }

        function saveSubmittedDate(dateStr) {
            submittedDates.push({
                desa: selectedDesa,
                date: dateStr
            });
            localStorage.setItem('dukopsSubmittedDates', JSON.stringify(submittedDates));
        }

        function isDuplicateSubmission() {
            const currentDate = new Date(tanggalWaktu);
            const currentYear = currentDate.getFullYear();
            const currentMonth = currentDate.getMonth();
            const currentDay = currentDate.getDate();
            return submittedDates.some(entry => {
                if (!entry || typeof entry !== "object" || !entry.desa || !entry.date) return false;
                const savedDate = new Date(entry.date);
                const savedDesa = entry.desa;
                return savedDesa === selectedDesa &&
                    savedDate.getFullYear() === currentYear &&
                    savedDate.getMonth() === currentMonth &&
                    savedDate.getDate() === currentDay;
            });
        }

        function loadLastSubmittedDates() {
            const savedDates = localStorage.getItem('dukopsSubmittedDates');
            submittedDates = savedDates ? JSON.parse(savedDates) : [];
        }

        function resetCanvas() {
            const canvas = document.getElementById("canvas");
            const ctx = canvas.getContext("2d");
            canvas.style.display = "none";
            canvas.width = 800;
            canvas.height = Math.round(canvas.width / (16/9));
            ctx.fillStyle = "#000";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        function resetAll() {
            if (confirm("Reset semua data?")) {
                submissionCount = 0;
                localStorage.setItem('dukopsSubmissionCount', '0');
                
                localStorage.removeItem('dukopsSendLogs');
                const logsContainer = document.getElementById('logTerkirim');
                if (logsContainer) logsContainer.innerHTML = '';
                
                submittedDates = [];
                localStorage.removeItem('dukopsSubmittedDates');
                
                resetForm();
                
                showNotification("âœ… Data berhasil direset", "success");
            }
        }

        // ================= EVENT LISTENERS =================
        
        document.addEventListener('visibilitychange', function() {
            if (!document.hidden && chatConnectionActive) {
                updateChatStatus('connected');
            }
        });
        
        window.addEventListener('beforeunload', function() {
            chatConnectionActive = false;
            saveChatHistory();
        });

        // Start when page is ready
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initialize);
        } else {
            initialize();
        }

        let deferredInstallPrompt = null;

        function isPwaInstalled() {
            return window.matchMedia('(display-mode: standalone)').matches ||
                window.navigator.standalone === true ||
                document.referrer.startsWith('android-app://');
        }

        function updateInstallButton() {
            const button = document.getElementById('installPwaButton');
            if (!button) return;
            button.classList.toggle('visible', Boolean(deferredInstallPrompt) && !isPwaInstalled());
        }

        window.addEventListener('beforeinstallprompt', event => {
            event.preventDefault();
            deferredInstallPrompt = event;
            updateInstallButton();
        });

        window.addEventListener('appinstalled', () => {
            deferredInstallPrompt = null;
            updateInstallButton();
        });

        document.getElementById('installPwaButton').addEventListener('click', async () => {
            if (!deferredInstallPrompt) return;
            const promptEvent = deferredInstallPrompt;
            deferredInstallPrompt = null;
            await promptEvent.prompt();
            await promptEvent.userChoice;
            updateInstallButton();
        });

        if (window.location.protocol !== 'file:' && 'serviceWorker' in navigator) {
            let reloadedForUpdate = false;
            window.addEventListener('load', () => {
                navigator.serviceWorker.addEventListener('controllerchange', () => {
                    if (reloadedForUpdate) return;
                    reloadedForUpdate = true;
                    window.location.reload();
                });

                navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(registration => {
                    registration.update();

                    registration.addEventListener('updatefound', () => {
                        const worker = registration.installing;
                        if (!worker) return;
                        worker.addEventListener('statechange', () => {
                            if (worker.state === 'installed' && navigator.serviceWorker.controller) {
                                worker.postMessage({ type: 'SKIP_WAITING' });
                            }
                        });
                    });

                    setInterval(() => registration.update(), 60 * 60 * 1000);
                }).catch(error => {
                    console.error('Service worker gagal didaftarkan:', error);
                });
            });
        }
    </script>
</body>
</html>
