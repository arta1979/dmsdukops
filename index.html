<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="mobile-web-app-capable" content="yes">
    <title>DUKOPS BABINSA - Sistem Pelaporan</title>

    <!-- FAVICON + LAMBANG KODAM UDAYANA -->
    <link rel="icon" type="image/svg+xml" href="icons/lambang-kodam-udayana.svg">
    <link rel="icon" type="image/png" sizes="512x512" href="icons/android-chrome-512x512.png">
    <link rel="icon" type="image/x-icon" href="icons/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#0B1220">

    <!-- Polyfill -->
    <script src="https://cdn.polyfill.io/v3/polyfill.min.js?features=default,es6,Promise,fetch,Array.prototype.includes"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
</head>
<body>

    <!-- TOMBOL INSTALL PWA -->
    <button id="installPwaButton" type="button">
        <i class="fas fa-download"></i> Instal Aplikasi
    </button>

    <!-- MODAL PILIH DESA -->
    <div id="desaStartModal">
        <div class="desa-start-card">
            <h2>Pilih Desa/Kelurahan</h2>
            <p>Pilih wilayah sebelum mengisi laporan.</p>
            <select id="selectDesa" onchange="loadSelectedDesa()">
                <option value="">-- Pilih Desa/Kelurahan --</option>
            </select>
            <div id="loadingDesa"><i class="fas fa-spinner fa-spin"></i> Memuat daftar desa...</div>
        </div>
    </div>

    <!-- BANNER DESA -->
    <img id="desaHeaderImage" alt="Banner Desa" style="display:none;">

    <!-- MAIN CONTAINER -->
    <div class="container">

        <!-- AREA CETAK -->
        <div id="printable-area">
            <div class="print-header">
                <div class="header-container">
                    <img src="icons/lambang-kodam-udayana.svg"
                         alt="Lambang Kodam Udayana"
                         class="header-lambang"
                         onerror="this.style.display='none'">
                    <div class="header-text">
                        <div class="header-title">DUKOPS BABINSA</div>
                        <div class="header-title">KORAMIL 1609-05/SUKASADA</div>
                        <div class="header-subtitle">Jl. Jelantik Gingsir No. 32 Sukasada Singaraja-Bali 81161</div>
                    </div>
                </div>
            </div>
            <table id="printable-table"></table>
        </div>

        <!-- STATUS CHANNEL TELEGRAM -->
        <div class="status-panel" id="channelStatusPanel">
            <div id="channelStatus" class="channel-status">
                <span class="status-indicator offline"></span>
                <span>Menyiapkan sistem...</span>
            </div>
            <button id="testBtn" type="button" onclick="testChannelConnection()">
                <i class="fas fa-sync-alt"></i> Tes Koneksi
            </button>
        </div>

        <!-- INPUT SECTION -->
        <div class="input-section dashboard-desa-status">
            <div class="mode-description hidden-text">
                Laporan otomatis disimpan ke Google Drive.
            </div>

            <div class="previewBox hidden-text" id="previewDesa"></div>

            <div id="loadingKoordinat"><i class="fas fa-spinner fa-spin"></i> Memuat koordinat...</div>
            <button class="refresh-btn" onclick="pickRandomKoordinat()">
                <i class="fas fa-random"></i> Acak Ulang Koordinat
            </button>
        </div>

        <div class="input-section">
            <label><span id="selectedDesaLabel"></span></label>

            <div class="file-input-container">
                <input type="file" id="gambar" accept="image/*" onchange="validateAndPreviewImage()">
                <div id="fileValidation" class="validation-message"></div>
            </div>

            <div class="tanggal-input-kustom">
                <input type="text" id="tanggalWaktuDisplay"
                       value="Pilih hari, tanggal, bulan, tahun dan waktu"
                       readonly aria-label="Tanggal dan waktu kegiatan">
                <input type="datetime-local" id="tanggalWaktu" step="1"
                       onchange="updateDatePreview()" aria-label="Pilih tanggal dan waktu">
            </div>
            <div class="previewBox" id="previewTanggal"></div>

            <canvas id="canvas"></canvas>

            <textarea id="narasi" rows="4" placeholder="Masukkan narasi kegiatan..."
                      oninput="autoResizeNarasi(this); checkInputCompletion()"></textarea>

            <div class="action-buttons">
                <button id="submitBtn" class="combined-button"
                        onclick="processSubmission()" disabled>
                    <i class="fas fa-cloud-upload-alt"></i> SIMPAN KE DRIVE
                </button>
                <button id="exitBtn" class="exit-button" type="button"
                        onclick="exitApplication()">
                    <i class="fas fa-sign-out-alt"></i> KELUAR
                </button>
            </div>
        </div>

        <!-- LOG PENGIRIMAN -->
        <div class="input-section log-section">
            <h3><i class="fas fa-history"></i> Riwayat Pengiriman</h3>
            <div id="logTerkirim" class="log-container"></div>
        </div>

    </div>

    <script>
        // ================= KONFIGURASI UTAMA =================
        const LOCAL_DATA_URL = "data/desa/daftar.txt";
        const TELEGRAM_BOT_TOKEN = "7580586404:AAFi3ySF36vBtLUiZUUsUrWuszBF2lBz7W0";
        const TELEGRAM_CHANNEL_ID = "-1003473372527";

        // ================= KONFIGURASI VALIDASI FOTO =================
        const MAX_FILE_SIZE = 10 * 1024 * 1024;
        const ALLOWED_TYPES = ['image/jpeg', 'image/png', 'image/jpg', 'image/gif', 'image/webp'];
        const MIN_WIDTH = 640;
        const MIN_HEIGHT = 480;

        // ================= VARIABEL GLOBAL =================
        let img = new Image();
        let selectedDesa = "";
        let kordinatList = [];
        let currentKoordinat = "";
        let tanggalWaktu = "";
        let submissionCount = 0;
        let submittedDates = [];
        let channelConnected = false;
        let currentFile = null;
        let fileIsValid = false;
        const DEVICE_TIME_ZONE = Intl.DateTimeFormat().resolvedOptions().timeZone;

        function getDeviceZoneLabel(date = new Date()) {
            const offsetMinutes = -date.getTimezoneOffset();
            if (offsetMinutes === 420) return "WIB";
            if (offsetMinutes === 480) return "WITA";
            if (offsetMinutes === 540) return "WIT";
            return DEVICE_TIME_ZONE || "Waktu perangkat";
        }

        function getIndonesiaDateParts(date = new Date()) {
            const parts = new Intl.DateTimeFormat('en-CA', {
                timeZone: DEVICE_TIME_ZONE,
                year: 'numeric', month: '2-digit', day: '2-digit',
                hour: '2-digit', minute: '2-digit', hourCycle: 'h23'
            }).formatToParts(date);
            return Object.fromEntries(parts
                .filter(part => part.type !== 'literal')
                .map(part => [part.type, part.value]));
        }

        function formatIndonesiaDate(date, options) {
            return date.toLocaleString('id-ID', {
                timeZone: DEVICE_TIME_ZONE, ...options
            });
        }

        function parseIndonesiaInput(value) { return new Date(value); }

        // ================= VALIDASI FOTO =================
        function validateAndPreviewImage() {
            const fileInput = document.getElementById("gambar");
            const validationMsg = document.getElementById("fileValidation");
            validationMsg.className = "validation-message";
            validationMsg.textContent = "";
            fileIsValid = false;
            document.getElementById("canvas").style.display = "none";
            img = new Image();
            if (!fileInput.files || fileInput.files.length === 0) {
                validationMsg.className = "validation-message validation-warning";
                validationMsg.textContent = "⚠️ Silakan pilih file gambar";
                return;
            }
            currentFile = fileInput.files[0];
            if (!ALLOWED_TYPES.includes(currentFile.type)) {
                validationMsg.className = "validation-message validation-error";
                validationMsg.textContent = `❌ Format file tidak didukung. Gunakan: JPEG, PNG, GIF, WebP`;
                fileInput.value = "";
                return;
            }
            if (currentFile.size > MAX_FILE_SIZE) {
                validationMsg.className = "validation-message validation-error";
                validationMsg.textContent = `❌ File terlalu besar (${formatFileSize(currentFile.size)}). Maksimal: ${formatFileSize(MAX_FILE_SIZE)}`;
                fileInput.value = "";
                return;
            }
            const reader = new FileReader();
            reader.onload = function(e) {
                img = new Image();
                img.src = e.target.result;
                img.onload = function() {
                    const width = img.width;
                    const height = img.height;
                    let validationStatus = "";
                    let statusClass = "";
                    if (width < MIN_WIDTH || height < MIN_HEIGHT) {
                        validationStatus = `⚠️ Resolusi rendah (min: ${MIN_WIDTH}×${MIN_HEIGHT})`;
                        statusClass = "validation-warning";
                        fileIsValid = false;
                        document.getElementById("canvas").style.display = "none";
                    } else {
                        validationStatus = "✅ Resolusi memadai";
                        statusClass = "validation-success";
                        fileIsValid = true;
                        document.getElementById("canvas").style.display = "block";
                    }
                    validationMsg.className = `validation-message ${statusClass}`;
                    validationMsg.innerHTML = `${validationStatus}<br><small>Rasio: ${(width/height).toFixed(2)}:1 | Format: ${currentFile.type.split('/')[1].toUpperCase()}</small>`;
                    if (kordinatList.length > 0) pickRandomKoordinat();
                    updatePreview();
                    checkInputCompletion();
                };
                img.onerror = function() {
                    document.getElementById("canvas").style.display = "none";
                    validationMsg.className = "validation-message validation-error";
                    validationMsg.textContent = "❌ Gagal memuat gambar. File mungkin rusak.";
                    fileInput.value = "";
                    fileIsValid = false;
                };
            };
            reader.readAsDataURL(currentFile);
        }

        function formatFileSize(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        // ================= FORM UTAMA =================
        async function loadSelectedDesa() {
            const select = document.getElementById('selectDesa');
            const coordUrl = select.value;
            const loading = document.getElementById('loadingKoordinat');
            if (!coordUrl) { resetForm(); return; }
            selectedDesa = select.options[select.selectedIndex].text;
            updateDesaHeaderImage(selectedDesa);
            const selectedDesaLabel = document.getElementById('selectedDesaLabel');
            if (selectedDesaLabel) selectedDesaLabel.textContent = selectedDesa;
            document.getElementById('previewDesa').textContent = "Desa/Kelurahan: " + selectedDesa;
            loading.style.display = 'block';
            try {
                const response = await fetch(coordUrl);
                if (!response.ok) throw new Error("Gagal memuat koordinat");
                const text = await response.text();
                kordinatList = text.split(/\r?\n/)
                    .map(line => line.trim())
                    .filter(line => line && !line.startsWith('#') && line.includes(','));
                if (kordinatList.length === 0) throw new Error("File koordinat kosong");
                currentKoordinat = "";
                pickRandomKoordinat();
                checkInputCompletion();
                document.getElementById('desaStartModal').classList.add('hidden');
            } catch (error) {
                console.error("Error:", error);
                showNotification("❌ Gagal memuat koordinat", "error");
            } finally {
                loading.style.display = 'none';
                updatePreview();
                checkInputCompletion();
            }
        }

        function pickRandomKoordinat() {
            if (kordinatList.length === 0) {
                showNotification("⚠️ Tidak ada data koordinat", "warning");
                return;
            }
            if (!selectedDesa) {
                showNotification("⚠️ Pilih desa terlebih dahulu", "warning");
                return;
            }
            const randomIndex = Math.floor(Math.random() * kordinatList.length);
            currentKoordinat = kordinatList[randomIndex];
            updatePreview();
            checkInputCompletion();
        }

        function updateDatePreview() {
            const tglInput = document.getElementById("tanggalWaktu").value;
            const preview = document.getElementById("previewTanggal");
            const display = document.getElementById("tanggalWaktuDisplay");
            if (tglInput) {
                let date;
                if (tglInput.includes('T')) {
                    date = parseIndonesiaInput(tglInput);
                } else {
                    const [datePart, timePart] = tglInput.split(' ');
                    const [year, month, day] = datePart.split('-');
                    const [hours, minutes] = timePart.split(':');
                    date = new Date(year, month - 1, day, hours, minutes);
                }
                const inputTime = tglInput.split('T')[1] || '';
                const inputSeconds = inputTime.split(':')[2];
                date.setSeconds(inputSeconds ? Number(inputSeconds) : new Date().getSeconds());
                tanggalWaktu = date.toISOString();
                const options = {
                    weekday: 'long', day: '2-digit', month: 'long', year: 'numeric',
                    hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false
                };
                if (date.toLocaleDateString) {
                    const formattedDate = `${formatIndonesiaDate(date, options)} ${getDeviceZoneLabel(date)}`;
                    preview.textContent = "";
                    if (display) display.value = formattedDate;
                }
            } else {
                tanggalWaktu = "";
                preview.textContent = "";
                if (display) display.value = "Pilih hari, tanggal, bulan, tahun dan waktu";
            }
            updatePreview();
            checkInputCompletion();
        }

        function exitApplication() {
            window.close();
            setTimeout(() => {
                if (!document.hidden) {
                    showNotification("Silakan tutup tab atau jendela aplikasi secara manual.", "warning");
                }
            }, 150);
        }

        function updateLiveSeconds() {
            const picker = document.getElementById("tanggalWaktu");
            if (!picker || !picker.value) return;
            const now = new Date();
            const [datePart, timePart] = picker.value.split("T");
            const [hours, minutes] = timePart.split(":");
            const seconds = String(now.getSeconds()).padStart(2, "0");
            const nextValue = `${datePart}T${hours}:${minutes}:${seconds}`;
            if (picker.value !== nextValue) {
                picker.value = nextValue;
                updateDatePreview();
            }
        }

        document.querySelector(".tanggal-input-kustom").addEventListener("click", function() {
            const picker = document.getElementById("tanggalWaktu");
            if (typeof picker.showPicker === "function") picker.showPicker();
            else picker.click();
        });

        function autoResizeNarasi(textarea) {
            textarea.style.height = "auto";
            textarea.style.height = `${textarea.scrollHeight}px`;
        }

        function updatePreview() {
            const canvas = document.getElementById("canvas");
            const ctx = canvas.getContext("2d");
            const canvasWidth = 800;
            const canvasHeight = 600;
            canvas.width = canvasWidth;
            canvas.height = canvasHeight;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            if (img.src && img.complete) {
                const imageRatio = img.width / img.height;
                const canvasRatio = canvasWidth / canvasHeight;
                let sourceWidth = img.width, sourceHeight = img.height;
                let sourceX = 0, sourceY = 0;
                if (imageRatio > canvasRatio) {
                    sourceWidth = img.height * canvasRatio;
                    sourceX = (img.width - sourceWidth) / 2;
                } else {
                    sourceHeight = img.width / canvasRatio;
                    sourceY = (img.height - sourceHeight) / 2;
                }
                ctx.drawImage(img, sourceX, sourceY, sourceWidth, sourceHeight, 0, 0, canvasWidth, canvasHeight);
            } else {
                ctx.fillStyle = "#000";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }
            if (selectedDesa || currentKoordinat || tanggalWaktu) {
                ctx.textAlign = "right";
                ctx.font = "36px Arial";
                ctx.fillStyle = "white";
                ctx.strokeStyle = "rgba(0, 0, 0, 0.85)";
                ctx.lineWidth = 4;
                ctx.lineJoin = "round";
                const bottomMargin = 20;
                const lineHeight = 40;
                const rightMargin = 10;
                if (selectedDesa) {
                    ctx.strokeText("Babinsa " + selectedDesa, canvas.width - rightMargin, canvas.height - bottomMargin - (lineHeight * 2));
                    ctx.fillStyle = "white";
                    ctx.fillText("Babinsa " + selectedDesa, canvas.width - rightMargin, canvas.height - bottomMargin - (lineHeight * 2));
                }
                if (currentKoordinat) {
                    ctx.strokeText(currentKoordinat, canvas.width - rightMargin, canvas.height - bottomMargin - lineHeight);
                    ctx.fillStyle = "white";
                    ctx.fillText(currentKoordinat, canvas.width - rightMargin, canvas.height - bottomMargin - lineHeight);
                }
                if (tanggalWaktu) {
                    const date = new Date(tanggalWaktu);
                    let dateText;
                    if (date.toLocaleDateString) {
                        const watermarkSeconds = String(date.getSeconds()).padStart(2, "0");
                        dateText = formatIndonesiaDate(date, { day: "2-digit", month: "long", year: "numeric" }) + ", " +
                            formatIndonesiaDate(date, { hour: "2-digit", minute: "2-digit", hour12: false }).replace(":", ".") + `.${watermarkSeconds}`;
                    }
                    ctx.strokeText(dateText, canvas.width - rightMargin, canvas.height - bottomMargin);
                    ctx.fillStyle = "white";
                    ctx.fillText(dateText, canvas.width - rightMargin, canvas.height - bottomMargin);
                }
            }
        }

        function createSafeFileName(value) {
            return (value || "laporan").normalize("NFKD").replace(/[^\w\s-]/g, "").trim().replace(/\s+/g, "_").replace(/-+/g, "-") || "laporan";
        }

        function getSubmissionBaseName() {
            const desa = createSafeFileName(selectedDesa || "Tanpa_Desa");
            const inputValue = document.getElementById("tanggalWaktu").value;
            const datePart = inputValue ? inputValue.split("T")[0] : "";
            const dateParts = datePart.split("-");
            const formattedDate = dateParts.length === 3 ? `${dateParts[2]}-${dateParts[1]}-${dateParts[0]}` : "Tanpa_Tanggal";
            const sequence = String(submissionCount + 1).padStart(3, "0");
            return `${sequence}_${desa}_${formattedDate}`;
        }

        function buildSubmissionNarrative() {
            const desa = selectedDesa || "Tanpa Desa";
            const narasi = document.getElementById("narasi").value.trim();
            const date = tanggalWaktu ? new Date(tanggalWaktu) : new Date();
            const formattedDate = formatIndonesiaDate(date, { weekday: "long", day: "2-digit", month: "long", year: "numeric" });
            return `${formattedDate}\tBabinsa ${desa} ${narasi}`;
        }

        function canvasToBlob(canvas) {
            return new Promise((resolve, reject) => {
                canvas.toBlob(blob => {
                    if (blob) resolve(blob);
                    else reject(new Error("Gagal membuat gambar laporan"));
                }, "image/png");
            });
        }

        async function downloadSubmissionZip() {
            if (typeof JSZip === "undefined") {
                throw new Error("Modul ZIP belum tersedia. Periksa koneksi lalu muat ulang halaman.");
            }
            const canvas = document.getElementById("canvas");
            const baseName = getSubmissionBaseName();
            const imageBlob = await canvasToBlob(canvas);
            const reportText = buildSubmissionNarrative();
            const zip = new JSZip();
            zip.file(`${baseName}.png`, imageBlob);
            zip.file(`${baseName}.txt`, reportText);
            const zipBlob = await zip.generateAsync({ type: "blob", compression: "DEFLATE" });
            return { zipBlob, baseName };
        }

        async function processSubmission() {
            const submitButton = document.getElementById("submitBtn");
            if (submitButton.dataset.processing === "true") return;
            if (!selectedDesa || !currentKoordinat || !fileIsValid || !tanggalWaktu) {
                checkInputCompletion();
                return;
            }
            if (isDuplicateSubmission()) {
                alert("Laporan dengan desa dan tanggal yang sama pada bulan dan tahun tersebut sudah pernah dikirim.");
                return;
            }
            submitButton.dataset.processing = "true";
            submitButton.disabled = true;
            submitButton.classList.add("is-processing");
            const originalButtonText = submitButton.innerHTML;
            submitButton.innerHTML = '<i class="fas fa-spinner fa-spin"></i> MENYIMPAN...';
            try {
                const submission = await downloadSubmissionZip();
                const driveUploaded = await window.uploadToGoogleDrive(
                    submission.zipBlob,
                    `${submission.baseName}.zip`,
                    selectedDesa,
                    new Date(tanggalWaktu)
                );
                updateCounter();
                saveSubmittedDate(tanggalWaktu);
                addSendLog(`${getSubmissionBaseName()}.zip`, "success");
                showNotification(
                    driveUploaded
                        ? "Laporan berhasil diunduh dan disimpan ke Google Drive."
                        : "Laporan berhasil diunduh, tetapi Google Drive menolak upload.",
                    driveUploaded ? "success" : "warning"
                );
            } catch (error) {
                console.error("Gagal membuat ZIP laporan:", error);
                addSendLog(`${getSubmissionBaseName()}.zip`, "failed", error.message);
            } finally {
                submitButton.disabled = false;
                submitButton.dataset.processing = "false";
                submitButton.classList.remove("is-processing");
                submitButton.innerHTML = originalButtonText;
                checkInputCompletion();
            }
        }

        async function testChannelConnection() {
            const statusElement = document.getElementById('channelStatus');
            const testBtn = document.getElementById('testBtn');
            if (statusElement) statusElement.querySelector('span:last-child').textContent = '● Menguji koneksi...';
            if (testBtn) testBtn.disabled = true;
            try {
                const response = await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getChat`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ chat_id: TELEGRAM_CHANNEL_ID })
                });
                const data = await response.json();
                updateChannelStatus(!!data.ok);
            } catch (error) {
                updateChannelStatus(false);
            } finally {
                if (testBtn) testBtn.disabled = false;
            }
        }

        function updateChannelStatus(connected) {
            const statusElement = document.getElementById('channelStatus');
            channelConnected = connected;
            if (!statusElement) return;
            const indicator = statusElement.querySelector('.status-indicator');
            if (connected) {
                statusElement.querySelector('span:last-child').textContent = '● Sistem siap';
                if (indicator) indicator.className = 'status-indicator online';
            } else {
                statusElement.querySelector('span:last-child').textContent = '● Menyiapkan sistem...';
                if (indicator) indicator.className = 'status-indicator offline';
            }
        }

        function updateDesaHeaderImage(desaName) {
            const headerImage = document.getElementById('desaHeaderImage');
            if (!headerImage) return;
            if (!desaName) {
                headerImage.src = 'https://github.com/Koramil05/DUKOPS/blob/main/bnr_default.png?raw=true';
                return;
            }
            const imageName = desaName.toLowerCase().replace(/\s+/g, '_');
            headerImage.src = `https://github.com/Koramil05/DUKOPS/blob/main/bnr_${imageName}.png?raw=true`;
        }

        function initialize() {
            if (!setupCanvas()) return;
            initializeCounter();
            loadDesaList();
            loadLastSubmittedDates();
            resetCanvas();
            const now = getIndonesiaDateParts();
            const seconds = String(new Date().getSeconds()).padStart(2, '0');
            document.getElementById('tanggalWaktu').value = `${now.year}-${now.month}-${now.day}T${now.hour}:${now.minute}:${seconds}`;
            updateDatePreview();
            setInterval(updateLiveSeconds, 1000);
            setTimeout(testChannelConnection, 1000);
        }

        function setupCanvas() {
            const canvas = document.getElementById('canvas');
            if (!canvas.getContext) { canvas.style.display = 'none'; return false; }
            return true;
        }

        async function loadDesaList() {
            const select = document.getElementById('selectDesa');
            const loading = document.getElementById('loadingDesa');
            loading.style.display = 'block';
            try {
                const response = await fetch(LOCAL_DATA_URL);
                if (!response.ok) throw new Error("Gagal memuat daftar desa");
                const desaFiles = (await response.text()).split(/\r?\n/)
                    .map(line => line.trim())
                    .filter(line => line && !line.startsWith('#') && /\.txt$/i.test(line));
                desaFiles.forEach(fileName => {
                    const desaName = fileName.replace(/\.txt$/i, '').replace(/[_-]+/g, ' ').trim();
                    const option = document.createElement('option');
                    option.value = `data/desa/${fileName}`;
                    option.textContent = desaName;
                    select.appendChild(option);
                });
                if (desaFiles.length === 0) showNotification("⚠️ Belum ada data desa lokal", "warning");
            } catch (error) {
                console.error("Error:", error);
                showNotification("❌ Gagal memuat daftar desa", "error");
            } finally {
                loading.style.display = 'none';
            }
        }

        function resetForm() {
            selectedDesa = "";
            kordinatList = [];
            currentKoordinat = "";
            document.getElementById('selectDesa').value = "";
            const selectedDesaLabel = document.getElementById('selectedDesaLabel');
            if (selectedDesaLabel) selectedDesaLabel.textContent = "";
            document.getElementById('previewDesa').textContent = "";
            document.getElementById('narasi').value = "";
            document.getElementById('gambar').value = "";
            document.getElementById('tanggalWaktu').value = "";
            document.getElementById('previewTanggal').textContent = "";
            document.getElementById('fileValidation').className = "validation-message";
            document.getElementById('fileValidation').textContent = "";
            fileIsValid = false;
            currentFile = null;
            updateDesaHeaderImage("");
            checkInputCompletion();
            updatePreview();
            resetCanvas();
        }

        function checkInputCompletion() {
            const isComplete = selectedDesa &&
                currentKoordinat &&
                tanggalWaktu &&
                fileIsValid &&
                img.src && img.complete &&
                document.getElementById("narasi").value.trim().length >= 10;
            document.getElementById("submitBtn").disabled = !isComplete;
        }

        function showNotification(message, type) {
            const notification = document.createElement('div');
            notification.className = `notification ${type}`;
            notification.textContent = message;
            document.body.appendChild(notification);
            setTimeout(() => {
                notification.style.opacity = '0';
                setTimeout(() => notification.remove(), 500);
            }, 3000);
        }

        // ================= FUNGSI BANTUAN =================
        function initializeCounter() {
            const savedCount = localStorage.getItem('dukopsSubmissionCount');
            submissionCount = savedCount ? parseInt(savedCount) : 0;
            loadSendLogs();
        }

        function updateCounter() {
            submissionCount++;
            localStorage.setItem('dukopsSubmissionCount', submissionCount.toString());
        }

        function addSendLog(filename, status, message = "") {
            const logsContainer = document.getElementById("logTerkirim");
            if (!logsContainer) {
                saveSendLog(filename, status, new Date().toLocaleTimeString('id-ID'));
                return;
            }
            const logEntry = document.createElement("div");
            logEntry.className = "log-entry";
            const time = new Date().toLocaleTimeString('id-ID');
            const statusClass = status === "success" ? "success" : "failed";
            logEntry.innerHTML = `
                <div class="log-time">${time}</div>
                <div class="log-filename">${filename}</div>
                <div class="log-status ${statusClass}">${status.toUpperCase()}</div>
            `;
            logsContainer.insertBefore(logEntry, logsContainer.firstChild);
            saveSendLog(filename, status, time);
        }

        function saveSendLog(filename, status, time) {
            let logs = JSON.parse(localStorage.getItem('dukopsSendLogs') || '[]');
            logs.unshift({ filename, status, time });
            if (logs.length > 50) logs = logs.slice(0, 50);
            localStorage.setItem('dukopsSendLogs', JSON.stringify(logs));
        }

        function loadSendLogs() {
            const logs = JSON.parse(localStorage.getItem('dukopsSendLogs') || '[]');
            const container = document.getElementById("logTerkirim");
            if (!container) return;
            logs.forEach(log => {
                const logEntry = document.createElement("div");
                logEntry.className = "log-entry";
                const statusClass = log.status === "success" ? "success" : "failed";
                logEntry.innerHTML = `
                    <div class="log-time">${log.time}</div>
                    <div class="log-filename">${log.filename}</div>
                    <div class="log-status ${statusClass}">${log.status.toUpperCase()}</div>
                `;
                container.appendChild(logEntry);
            });
        }

        function saveSubmittedDate(dateStr) {
            submittedDates.push({ desa: selectedDesa, date: dateStr });
            localStorage.setItem('dukopsSubmittedDates', JSON.stringify(submittedDates));
        }

        function isDuplicateSubmission() {
            const currentDate = new Date(tanggalWaktu);
            const currentYear = currentDate.getFullYear();
            const currentMonth = currentDate.getMonth();
            const currentDay = currentDate.getDate();
            return submittedDates.some(entry => {
                if (!entry || typeof entry !== "object" || !entry.desa || !entry.date) return false;
                const savedDate = new Date(entry.date);
                return entry.desa === selectedDesa &&
                    savedDate.getFullYear() === currentYear &&
                    savedDate.getMonth() === currentMonth &&
                    savedDate.getDate() === currentDay;
            });
        }

        function loadLastSubmittedDates() {
            const savedDates = localStorage.getItem('dukopsSubmittedDates');
            submittedDates = savedDates ? JSON.parse(savedDates) : [];
        }

        function resetCanvas() {
            const canvas = document.getElementById("canvas");
            const ctx = canvas.getContext("2d");
            canvas.style.display = "none";
            canvas.width = 800;
            canvas.height = Math.round(canvas.width / (16/9));
            ctx.fillStyle = "#000";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        function resetAll() {
            if (confirm("Reset semua data?")) {
                submissionCount = 0;
                localStorage.setItem('dukopsSubmissionCount', '0');
                localStorage.removeItem('dukopsSendLogs');
                const logsContainer = document.getElementById('logTerkirim');
                if (logsContainer) logsContainer.innerHTML = '';
                submittedDates = [];
                localStorage.removeItem('dukopsSubmittedDates');
                resetForm();
                showNotification("✅ Data berhasil direset", "success");
            }
        }

        // ================= START =================
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initialize);
        } else {
            initialize();
        }

        // ================= PWA =================
        let deferredInstallPrompt = null;

        function isPwaInstalled() {
            return window.matchMedia('(display-mode: standalone)').matches ||
                window.navigator.standalone === true ||
                document.referrer.startsWith('android-app://');
        }

        function updateInstallButton() {
            const button = document.getElementById('installPwaButton');
            if (!button) return;
            button.classList.toggle('visible', Boolean(deferredInstallPrompt) && !isPwaInstalled());
        }

        window.addEventListener('beforeinstallprompt', event => {
            event.preventDefault();
            deferredInstallPrompt = event;
            updateInstallButton();
        });

        window.addEventListener('appinstalled', () => {
            deferredInstallPrompt = null;
            updateInstallButton();
        });

        document.getElementById('installPwaButton').addEventListener('click', async () => {
            if (!deferredInstallPrompt) return;
            const promptEvent = deferredInstallPrompt;
            deferredInstallPrompt = null;
            await promptEvent.prompt();
            await promptEvent.userChoice;
            updateInstallButton();
        });

        if ('serviceWorker' in navigator) {
            let reloadedForUpdate = false;
            window.addEventListener('load', () => {
                navigator.serviceWorker.addEventListener('controllerchange', () => {
                    if (reloadedForUpdate) return;
                    reloadedForUpdate = true;
                    window.location.reload();
                });
                navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(registration => {
                    registration.update();
                    registration.addEventListener('updatefound', () => {
                        const worker = registration.installing;
                        if (!worker) return;
                        worker.addEventListener('statechange', () => {
                            if (worker.state === 'installed' && navigator.serviceWorker.controller) {
                                worker.postMessage({ type: 'SKIP_WAITING' });
                            }
                        });
                    });
                    setInterval(() => registration.update(), 60 * 60 * 1000);
                }).catch(error => {
                    console.error('Service worker gagal didaftarkan:', error);
                });
            });
        }
    </script>
</body>
</html>
